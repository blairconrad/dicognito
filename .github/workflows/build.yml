name: Build

env:
  UV_VERSION: '0.13.0'
  MIN_PYTHON_VERSION: '3.11'

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:

  test:

    continue-on-error: ${{ contains(matrix.job-prefix, 'experimental') }}
    name: ${{ matrix.job-prefix }}test ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        job-prefix: ['']
        os: [ubuntu-latest, windows-latest]
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        # Uncomment the following lines to test with a not-yet supported Python version
        # include:
        #   - job-prefix: 'experimental '
        #     os: ubuntu-latest
        #     python-version: '3.12-dev'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: ${{ matrix.python-version }}
          version: ${{ env.UV_VERSION }}
      - name: Test
        run: uv run --python ${{ matrix.python-version }} test.py

  package:

    needs: test
    runs-on: ubuntu-latest

    outputs:
      release-name: ${{ steps.gather-release-info.outputs.release-name }}
      release-body: ${{ steps.gather-release-info.outputs.release-body }}
      is-prerelease: ${{ steps.gather-release-info.outputs.is-prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: ${{ env.MIN_PYTHON_VERSION }}
          version: ${{ env.UV_VERSION }}
      - name: Build Package
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/
          name: dist
      - name: Gather release info
        id: gather-release-info
        run: uv run --python ${{ env.MIN_PYTHON_VERSION }} --script tools/gather-release-info-for-github-actions.py

  publish:

    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write # for creating the release
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Reject build if release name disagrees with tag
        if: format('{0}{1}', 'refs/tags/', needs.package.outputs.release-name) != github.ref
        run: |
          echo "Tag ${{ github.ref }} does not match release name ${{ needs.package.outputs.release-name }}"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="$(mktemp)"

          cat > "$notes_file" <<'EOF'
          ${{ needs.package.outputs.release-body }}
          EOF

          gh release create "${{ needs.package.outputs.release-name }}" \
            --title "${{ needs.package.outputs.release-name }}" \
            --notes-file "$notes_file" \
            $([ "${{ needs.package.outputs.is-prerelease }}" = "true" ] && echo --prerelease)
      - name: Publish distribution package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
